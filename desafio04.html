    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow-sm p-4">
                    <h3 class="mb-4">Cadastro de Atendimento</h3>
                    <form>
                        <div class="row g-3">
                            <div class="col-sm-6">
                                <label class="form-label">Nome do Cliente</label>
                                <input type="text" class="form-control" placeholder="Roberto carlos" required>
                            </div>
                            <div class="col-sm-6">
                                <label class="form-label">Telefone / WhatsApp</label>
                                <div class="input-group">
                                    <span class="input-group-text">+55</span>
                                    <input type="tel" class="form-control" placeholder="41999999999" required>
                                </div>
                            </div>

                            <div class="col-sm-6">
                                <label class="form-label">Tipo de Serviço</label>
                                <select class="form-select" required>
                                    <option value="" selected>Escolha uma opção ...</option>
                                    <option value="1">Manutenção de computador</option>
                                    <option value="2">Manutenção de celular</option>
                                    <option value="3">Instalação de software</option>
                                    <option value="4">Configuração de rede</option>
                                </select>
                            </div>
                            <div class="col-sm-6">
                                <label class="form-label">Valor Estimado</label>
                                <div class="input-group">
                                    <span class="input-group-text">R$</span>
                                    <input type="number" class="form-control" placeholder="150.00" min="0" step="0.01">
                                </div>
                            </div>

                            <div class="col-12">
                                <label class="form-label">Observações</label>
                                <textarea class="form-control" rows="4" placeholder="Descreva o problema relatado pelo cliente"></textarea>
                            </div>

                            <div class="col-12">
                                <div class="form-check">
                                    <input type="checkbox" id="ciencia" class="form-check-input" required>
                                    <label for="ciencia" class="form-check-label">
                                        Declaro ciência das condições do atendimento
                                    </label>
                                </div>
                            </div>

                            <div class="col-12 mt-4">
                                <button class="btn btn-success w-100" type="submit">Registrar Atendimento</button>
                            </div>

                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
